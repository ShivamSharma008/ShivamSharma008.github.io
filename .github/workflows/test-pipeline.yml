# TestMu AI SDET-2 Quality Engineering Assessment
# CI/CD Pipeline - GitHub Actions
# Author: Shivam Sharma, Senior SDET
#
# Why Option A (CI/CD Pipeline) over Option B (Dashboard):
# A CI/CD pipeline is the backbone of quality engineering. Tests that aren't
# automated in CI are effectively manual tests. This pipeline ensures every
# push and PR gets validated, reports are published as artifacts, and the
# team gets immediate signal on quality. A dashboard is valuable but secondary
# to having tests that run automatically on every change.

name: TestMu SDET-2 Test Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run tests (Shard ${{ matrix.shard }}/2)
        run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          CI: true
          ENVIRONMENT: staging

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: reports/test-results.json
          retention-days: 30

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 30

  merge-reports:
    name: Merge Test Reports
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-shard-*
          path: all-reports

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: full-test-report
          path: all-reports/
          retention-days: 30

  notify:
    name: Notify on Failure
    needs: test
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Create failure summary
        run: |
          echo "## ❌ Test Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the test artifacts for detailed failure reports." >> $GITHUB_STEP_SUMMARY

      - name: Notify via GitHub Status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              description: 'Test pipeline failed - check artifacts',
              context: 'TestMu SDET-2 Pipeline'
            });
